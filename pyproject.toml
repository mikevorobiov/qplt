[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qplt"
version = "0.7.0"
description = "Matplotlib styling, colorschemes, and fonts for physics-style figures"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MV" }]
keywords = ["matplotlib", "plotting", "physics", "publication", "colormap", "style"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU License",
    "Framework :: Matplotlib",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["qplt*"]
where = ["qplt"]

[tool.setuptools.package-data]
qplt = ["styles/*.mplstyle", "fontfiles/*.ttf", "fontfiles/*.txt"]
